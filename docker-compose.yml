services:
  # 1. Keycloak Database
  keycloak-db:
    image: postgres:15
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_pass
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # 2. Keycloak Server
  keycloak:
    image: quay.io/keycloak/keycloak:22.0.1
    container_name: keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_pass
    ports:
      - "8080:8080"
    depends_on:
      - keycloak-db

  # 3. Message Broker (RabbitMQ)
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  # 4. Product Database
  product-db:
    image: postgres:15
    container_name: product-db
    environment:
      POSTGRES_DB: products_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - product_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  # 5. Product Service
  product-service:
    build: ./product-service
    container_name: product-service
    ports:
      - "5001:5001"
    environment:
      - DATABASE_URL=postgresql://postgres:password@product-db:5432/products_db
      - RABBITMQ_HOST=rabbitmq
      - KEYCLOAK_URL=http://keycloak:8080/realms/eshop-realm
    depends_on:
      - product-db
      - rabbitmq

  # 6. Order Database
  order-db:
    image: postgres:15
    container_name: order-db
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - order_db_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"

  # 7. Order Service
  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "5002:5002"
    environment:
      - DATABASE_URL=postgresql://postgres:password@order-db:5432/orders_db
      - RABBITMQ_HOST=rabbitmq
      - KEYCLOAK_URL=http://keycloak:8080/realms/eshop-realm
    depends_on:
      - order-db
      - rabbitmq

  # 8. Frontend Web Client
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - product-service
      - order-service

volumes:
  keycloak_db_data:
  product_db_data:
  order_db_data: